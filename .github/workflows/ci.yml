name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Install, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint codebase
        run: npm run lint

      - name: Run test suite
        run: npm run test --if-present
